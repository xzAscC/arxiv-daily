[project]
name = "arxiv-daily"
version = "0.1.0"
description = "Daily arXiv digest ranked by your research interests, reviewed by an LLM and delivered by email."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "arxiv>=2.1.3",
    "loguru>=0.7.2",
    "sentence-transformers>=5.1",
    "python-dotenv>=1.0.1",
    "feedparser>=6.0.11",
    "tqdm>=4.67.0",
    "transformers>=4.51",
]

[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "pytest-cov>=6.2.1",
]
